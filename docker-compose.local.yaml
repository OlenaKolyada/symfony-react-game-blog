services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    networks:
      - grem
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$(cat /run/secrets/mysql_password)\" mysql -h localhost -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e \"SELECT 1\" >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/backend/vhosts:/etc/apache2/sites-enabled
      - ./backend:/var/www
      - backend-vendor:/var/www/vendor
      - backend-var:/var/www/var
      - ./docker/backend/entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    networks:
      - grem
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      API_URL_INTERNAL: http://backend
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - grem
    depends_on:
      - backend
    restart: unless-stopped
    command: sh /app/entrypoint.sh
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

networks:
  grem:

volumes:
  db-data:
  backend-vendor:
  backend-var:
  frontend-node-modules:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
